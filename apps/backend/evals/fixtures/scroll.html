<!doctype html>
<html>
<head><meta charset="utf-8"><title>Scroll Test</title></head>
<body style="font-family:sans-serif;margin:0">
  <div style="padding:40px"><h1>Top of page</h1><p>Scroll down to find the button.</p></div>
  <div style="height:2600px"></div>
  <div style="padding:40px">
    <button id="deep">Deep button</button>
    <div id="deep-result"></div>
  </div>
  <div style="height:600px"></div>
  <script>
    document.getElementById("deep").addEventListener("click", () => {
      document.getElementById("deep-result").textContent = "clicked";
    });
  </script>
</body>
</html>
