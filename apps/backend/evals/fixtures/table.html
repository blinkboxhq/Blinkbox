<!doctype html>
<html>
<head><meta charset="utf-8"><title>Pricing</title></head>
<body style="font-family:sans-serif;padding:40px">
  <h1>Products</h1>
  <table id="products" border="1" cellpadding="8">
    <thead><tr><th>Name</th><th>Price</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="page">Page 1</div>
  <button id="prev">Prev</button>
  <button id="next">Next</button>
  <script>
    const PAGES = [
      [["Widget Alpha", "$10"], ["Widget Beta", "$20"], ["Widget Gamma", "$30"]],
      [["Widget Zeta", "$99"], ["Widget Omega", "$120"]],
    ];
    let p = 0;
    function render() {
      document.getElementById("rows").innerHTML =
        PAGES[p].map(r => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("");
      document.getElementById("page").textContent = "Page " + (p + 1);
    }
    document.getElementById("next").addEventListener("click", () => { if (p < PAGES.length - 1) { p++; render(); } });
    document.getElementById("prev").addEventListener("click", () => { if (p > 0) { p--; render(); } });
    render();
  </script>
</body>
</html>
