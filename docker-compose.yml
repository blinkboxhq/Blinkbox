# Blinkbox — self-hosted install.
#
# Installed by docker/install.sh. To run it from a source checkout instead:
#
#   cp docker/env.example .env && $EDITOR .env
#   docker compose up -d          # then open http://localhost
#
# Caddy is the only published listener — everything reaches the app through it.
#
# Workflows, executions and credentials live in the Mongo below — on your disk,
# in your network. Credits are metered against your Blinkbox cloud account via
# SELF_HOST_LICENSE_KEY, so plan and purchased credits carry over unchanged.

name: blinkbox

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/blinkboxhq/blinkbox-backend:${BLINKBOX_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/blinkbox
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (exactly 32 chars)}
      SELF_HOSTED: "true"
      CLOUD_API_URL: ${CLOUD_API_URL:-https://api.blinkbox.net}
      SELF_HOST_LICENSE_KEY: ${SELF_HOST_LICENSE_KEY:?get one at blinkbox.net → Settings → Self-hosting}
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Optional — your own provider keys for AI and integration nodes.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    expose:
      - "3000"

  frontend:
    image: ghcr.io/blinkboxhq/blinkbox-frontend:${BLINKBOX_TAG:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Deliberately no VITE_API_URL: a self-hosted build talks to its own
        # origin, so one image works on every customer domain without a rebuild.
        VITE_SELF_HOSTED: "true"
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  # Fronts the whole install on <name>.blinkbox.net and gets a Let's Encrypt
  # certificate on its own — the DNS record the installer created is what makes
  # the HTTP-01 challenge resolve.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      BLINKBOX_HOSTNAME: ${BLINKBOX_HOSTNAME:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  mongo-data:
  redis-data:
  caddy-data:
  caddy-config:
