server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed bundles are immutable; index.html must never be cached or users get
  # a stale shell pointing at assets that no longer exist after an upgrade.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side router: unknown paths are app routes, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
