[phases.setup]
nixPkgs = ["nodejs_22", "chromium", "python3", "vips", "pkg-config", "gcc", "gnumake", "curl"]

[phases.install]
cmds = [
  "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install --prefer-offline",
  "curl -fsSL https://ollama.com/install.sh | sh || echo 'Ollama install skipped'"
]

[phases.build]
cmds = []

[start]
cmd = "PUPPETEER_EXECUTABLE_PATH=$(which chromium) node_modules/.bin/tsx src/index.js"
