<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog Test</title></head>
<body style="font-family:sans-serif;padding:40px">
  <h1>Danger zone</h1>
  <button id="danger">Delete item</button>
  <div id="outcome"></div>
  <script>
    document.getElementById("danger").addEventListener("click", () => {
      const ok = confirm("Delete item?");
      document.getElementById("outcome").textContent = ok ? "accepted" : "cancelled";
    });
  </script>
</body>
</html>
