name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    # Only trigger this robot if files inside the frontend folder change
    paths:
      - "apps/frontend/**"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          # Removed the strict cache path so it auto-detects

      - name: Install Dependencies
        working-directory: ./apps/frontend
        # Switched from 'npm ci' to 'npm install' so it doesn't crash without a lockfile
        run: npm install

      - name: Build React App
        working-directory: ./apps/frontend
        env:
          VITE_GOOGLE_CLIENT_ID: "914837067072-6iem3t2t0t79irj6dtlano5irqqq0v7k.apps.googleusercontent.com"
          CI: false # The magic kill-switch for warnings
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/frontend/dist
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Tell GitHub where the built files are
          path: ./apps/frontend/dist

 deploy:
    environment:
      name: github-pages
      url: https://blinkbox.net  # 👈 Update this to your real domain
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4